name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: account-policies (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [contract-allowlist, rate-limit, spend-limit]
    defaults:
      run:
        working-directory: account-policies/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  event-listeners:
    name: event-listeners (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [postgres-sink, webhook-relay]
    defaults:
      run:
        working-directory: event-listeners/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - run: cargo test
      - name: Validate postgres-sink docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
        working-directory: event-listeners/postgres-sink

  anchor-configs:
    name: anchor-configs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor-configs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: anchor-configs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check generate-config.js
