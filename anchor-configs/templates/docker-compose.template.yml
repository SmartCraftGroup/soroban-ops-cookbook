services:
  anchor-platform:
    image: stellar/anchor-platform:latest
    command: --sep-server --platform-server
    ports:
      - "8080:8080"   # SEP server
      - "8085:8085"   # Platform API
    volumes:
      - ./config:/config
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
{{SEP24_UI_SERVICE}}
  db:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: {{DB_PASSWORD}}
      POSTGRES_DB: anchor_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - anchor_db_data:/var/lib/postgresql/data

volumes:
  anchor_db_data:
